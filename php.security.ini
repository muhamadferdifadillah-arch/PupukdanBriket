#!/bin/bash

# ============================================
# PHP SECURITY CONFIGURATION (php.ini)
# ============================================
# 
# Konfigurasi ini meningkatkan keamanan PHP dengan menonaktifkan fungsi-fungsi
# yang berbahaya dan mengaktifkan fitur security built-in PHP

# Disable dangerous functions yang sering digunakan untuk exploit
disable_functions = "exec, passthru, shell_exec, system, proc_open, popen, curl_exec, curl_multi_exec, parse_ini_file, show_source, eval, assert, create_function, base64_decode"

# Disable dangerous functions untuk file operations
disable_functions = "dl, allow_url_fopen, allow_url_include, fopen, fwrite, file_get_contents"

# Disable access to private data
display_errors = Off
display_startup_errors = Off

# Enable error logging (akan di-log ke file, bukan ditampilkan ke user)
log_errors = On
error_log = /var/log/php/error.log

# Session security
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1      # Hanya kirim cookie via HTTPS
session.cookie_samesite = Lax   # Prevent CSRF attacks
session.name = PHPSESSID
session.auto_start = 0

# File upload restrictions
file_uploads = On
upload_max_filesize = 5M
max_file_uploads = 20
upload_tmp_dir = /var/tmp

# PHP Execution
max_execution_time = 30
max_input_time = 60
memory_limit = 128M

# Open base dir - restrict file access
open_basedir = /var/www:/tmp

# SQL related
mysql.allow_persistent = Off
mysqli.allow_persistent = Off

# Disable expose PHP version in headers
expose_php = Off

# Enable filter extension untuk input validation
extension = filter.so

# Disable remote file inclusion
allow_url_fopen = Off
allow_url_include = Off

# Enable register_globals protection (disable it)
register_globals = Off

# Magic quotes (deprecated, tapi pastikan off)
magic_quotes_gpc = Off

# Strict types (untuk production, sangat disarankan)
zend.assertions = -1

# ============================================
# NOTES:
# ============================================
# 1. File ini harus di-place di direktori yang tepat (biasanya /etc/php/X.X/apache2/ atau /etc/php/X.X/fpm/)
# 2. Restart PHP & web server setelah konfigurasi diubah
# 3. Test konfigurasi dengan: php -i | grep -i "disable_functions"
# ============================================
